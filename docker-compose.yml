# Web stats server + database for the Battlefield 2142 stats emulator.
# The Fesl login server (Windows only) runs outside Docker and can reach the
# database on 127.0.0.1:3306.
#
#   cp .env.example .env    # then edit the passwords and AUTHORISED_SERVERS
#   docker compose up -d --build

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-bf2142}
      MARIADB_USER: ${DB_USER:-bf2142}
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
      AUTHORISED_SERVERS: ${AUTHORISED_SERVERS:-}
    volumes:
      - db-data:/var/lib/mysql
      # Run in name order on first start only
      - ./database/bf2142.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/db/20-authorise-servers.sh:/docker-entrypoint-initdb.d/20-authorise-servers.sh:ro
    ports:
      # Localhost only, for the Fesl login server on the same machine
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-bf2142}
      DB_USER: ${DB_USER:-bf2142}
      DB_PASS: ${DB_PASS}
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - web-logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  web-logs:
