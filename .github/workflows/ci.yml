name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Check every PHP file parses
        run: |
          status=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /dev/null || status=1
          done < <(find web tests docker -type f \( -name '*.php' -o -name '*.aspx' \) -print0)
          exit $status

  smoke:
    name: Smoke test (PHP 8.3, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.11', 'mariadb:11.8', 'mysql:8.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bf2142
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bf2142
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL: mysql -h127.0.0.1 -P3306 -uroot -proot bf2142
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: none
      - name: Load the schema and authorise this machine as a game server
        run: |
          $MYSQL < database/bf2142.sql
          $MYSQL -e "INSERT INTO servers (ip, authorised, prefix) VALUES ('127.0.0.1', 1, 'BF2142')"
      - name: Configure and start the stats server
        run: |
          cp web/include/_ccconfig.example.php web/include/_ccconfig.php
          DB_HOST=127.0.0.1 DB_NAME=bf2142 DB_USER=root DB_PASS=root \
          ADMIN_USER=admin ADMIN_PASS=ci-admin \
            php docker/web/configure.php web/include/_ccconfig.php
          mkdir -p web/logs
          php -d log_errors=1 -d error_log="$PWD/php_errors.log" \
            -S 127.0.0.1:8088 -t web tests/router.php > server.log 2>&1 &
      - name: Run smoke test
        env:
          BASE_URL: http://127.0.0.1:8088
          DB_CMD: ${{ env.MYSQL }}
          ADMIN_USER: admin
          ADMIN_PASS: ci-admin
        run: python3 tests/smoke_test.py
      - name: Fail on PHP fatal errors
        if: always()
        run: |
          touch php_errors.log
          if grep -i 'fatal' php_errors.log; then exit 1; fi
      - name: PHP error log
        if: failure()
        run: cat php_errors.log server.log

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASS=.*/DB_PASS=ci-pass/; s/^DB_ROOT_PASS=.*/DB_ROOT_PASS=ci-root/; s/^WEB_PORT=.*/WEB_PORT=8080/' .env
          # Requests from the runner reach the container through Docker's network
          sed -i 's#^AUTHORISED_SERVERS=.*#AUTHORISED_SERVERS=127.0.0.1,172.16.0.0/12#' .env
          sed -i 's/^ADMIN_USER=.*/ADMIN_USER=admin/; s/^ADMIN_PASS=.*/ADMIN_PASS=ci-admin/; s#^ADMIN_HOSTS=.*#ADMIN_HOSTS=172.16.0.0/12#' .env
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Run smoke test
        env:
          BASE_URL: http://127.0.0.1:8080
          DB_CMD: docker compose exec -T db mariadb -ubf2142 -pci-pass bf2142
          ADMIN_USER: admin
          ADMIN_PASS: ci-admin
        run: python3 tests/smoke_test.py
      - name: Fail on PHP fatal errors
        if: always()
        run: |
          if docker compose logs web | grep -i 'PHP Fatal'; then exit 1; fi
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v

  fesl:
    name: FESL server tests (${{ matrix.db }}, ${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: 'mariadb:10.11'
            client: libmariadb-dev
          - db: 'mariadb:11.8'
            client: libmariadb-dev
          - db: 'mysql:8.4'
            client: libmysqlclient-dev
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bf2142
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bf2142
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      MYSQL: mysql -h127.0.0.1 -P3306 -uroot -proot bf2142
    defaults:
      run:
        working-directory: fesl_server
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL and database client headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev ${{ matrix.client }}
      - name: Decoder and session tests (replay of the captures)
        run: make -C tests test
      - name: Build the FESL server
        run: make -C src/server
      - name: Load the schema and add a database user with the server's rights
        run: |
          $MYSQL < ../database/bf2142.sql
          # the rights the README lists; the default password method of each
          # database server
          $MYSQL -e "CREATE USER 'fesl'@'%' IDENTIFIED BY 'fesl-pass'; GRANT SELECT ON bf2142.* TO 'fesl'@'%'; GRANT INSERT ON bf2142.account TO 'fesl'@'%'; GRANT INSERT, DELETE ON bf2142.subaccount TO 'fesl'@'%'; GRANT UPDATE (challenge, authtoken), DELETE ON bf2142.gamespy_players TO 'fesl'@'%'"
      - name: Server end-to-end test (TLS, plain TCP and the account table)
        working-directory: fesl_server/tests
        env:
          FESL_DB_HOST: 127.0.0.1
          FESL_DB_PORT: 3306
          FESL_DB_NAME: bf2142
          FESL_DB_USER: fesl
          FESL_DB_PASS: fesl-pass
          DB_CMD: ${{ env.MYSQL }}
        run: python3 test_server.py ../src/server/fesl_server
      - name: Decoder and session tests with ASan/UBSan
        run: |
          make -C tests clean
          make -C tests test SANITIZE=1

  stcppipe:
    name: stcppipe build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Build stcppipe against the system OpenSSL
        run: make -C fesl_server/src
